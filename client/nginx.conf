# =============================================================================
# nginx.conf — Serves React App + Proxies API Calls to Backend
# =============================================================================
# Nginx does TWO jobs here:
#   1. Serves the React static files (HTML, JS, CSS)
#   2. Proxies /api/ and /health requests to the Fastify backend
#
# WHY a proxy?
#   In Docker, the frontend and backend are separate containers.
#   The browser can't reach "http://backend:3001" directly — that's
#   a Docker internal hostname. Nginx translates:
#     Browser → http://localhost:3000/api/query
#     Nginx   → http://backend:3001/api/query  (internal Docker network)
#     Response flows back through Nginx to the browser
#
#   This also eliminates CORS issues since everything goes through
#   the same origin (port 3000).
# =============================================================================

server {
    # Listen on port 80 inside the container.
    # docker-compose maps this to port 3000 on the host.
    listen 80;

    # --- Serve React Static Files ---
    # Any request that doesn't match /api/ or /health serves the React app.
    location / {
        # Root directory where the React build files live
        root /usr/share/nginx/html;

        # try_files attempts to serve the requested file directly.
        # If the file doesn't exist (e.g., /chat is a React route, not a file),
        # it falls back to index.html so React Router can handle it.
        # This is REQUIRED for single-page apps (SPA) with client-side routing.
        try_files $uri $uri/ /index.html;
    }

    # --- Proxy API Requests to Backend ---
    # Any request starting with /api/ gets forwarded to the Fastify backend.
    # "backend" is the Docker Compose service name — Docker's internal DNS
    # resolves it to the backend container's IP automatically.
    location /api/ {
        proxy_pass http://backend:3001;

        # Pass the original Host header to the backend
        proxy_set_header Host $host;

        # Pass the real client IP (not Nginx's IP) to the backend
        proxy_set_header X-Real-IP $remote_addr;

        # Increase timeouts for long-running RAG queries.
        # Claude might take 10-30 seconds to generate an answer.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Increase max body size for file uploads (default is 1MB).
        # Must be >= the MAX_FILE_SIZE in our backend config.
        client_max_body_size 15M;
    }

    # --- Proxy Health Check ---
    location /health {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }
}